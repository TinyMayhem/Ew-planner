<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Gear Beta | UTW</title><link rel="stylesheet" href="/assets/hub.css"><style>iframe{border:0;width:100%;height:100dvh;display:block}#gate{max-width:450px;margin:60px auto}body.open{overflow:hidden}</style><link rel="stylesheet" href="/assets/forest.css"></head><body><main id="gate" class="container panel"><span class="tiny-mascot tiny-gear" style="width:140px;margin:0 auto" aria-hidden="true"></span><span class="eyebrow">UTW private beta</span><h1>Gear planner</h1><p>Enter the beta passcode to test the gear guide.</p><form id="login"><label for="password">Beta passcode</label><input id="password" type="password" required autocomplete="current-password"><button class="btn primary" style="margin-top:12px">Open gear beta</button></form><p id="message" role="status"></p><a href="/">Back to UTW</a></main><iframe id="app" class="hidden" title="UTW gear beta"></iframe><script>const gate=document.getElementById('gate'),app=document.getElementById('app'),message=document.getElementById('message');function open(){gate.hidden=true;app.classList.remove('hidden');app.src='/api/gear';document.body.classList.add('open');}fetch('/api/gear',{cache:'no-store'}).then(r=>{if(r.ok)open();});document.getElementById('login').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/gear',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const data=await r.json();if(!r.ok)throw Error(data.error);document.getElementById('password').value='';open();}catch(error){message.textContent=error.message;}};</script></body></html>
